[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-assistant"
version = "0.1.0"
description = "Local tutoring assistant: notes in, feedback + materials + schedule brief out."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.7",
    "pydantic>=2",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]
dev = ["pytest>=8"]

[project.scripts]
tutor = "tutor_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["tutor_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
