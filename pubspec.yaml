name: intelliglove
description: "Intelligent Glove for Arabic Sign Language — Firebase backend & data layer."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

# ─────────────────────────────────────────────────────────────────────────────
#  Dependencies
#
#  These are the lines you must MERGE into your existing app's pubspec.yaml.
#  Everything the backend layer (lib/backend/**) needs is listed here.
#  Run `flutter pub get` after merging.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # Firebase core + the services this backend uses
  firebase_core: ^3.6.0          # required to initialise Firebase
  firebase_auth: ^5.3.1          # email/password + Google sign-in
  cloud_firestore: ^5.4.4        # all collections / documents
  firebase_storage: ^12.3.4      # profile photo uploads
  firebase_messaging: ^15.1.3    # push notifications for alerts
  cloud_functions: ^5.1.3        # callable functions (username reservation)

  # Google sign-in (v6 API — see docs/SETUP_GUIDE.md if you are on v7+)
  google_sign_in: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test: # emulator-backed backend tests (test/ + integration_test/)
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
