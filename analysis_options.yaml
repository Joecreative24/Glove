include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Backend models intentionally keep wide constructors.
    prefer_const_constructors_in_immutables: ignore
  exclude:
    - "**/*.g.dart"
    - "lib/firebase_options.dart" # generated by flutterfire configure

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
